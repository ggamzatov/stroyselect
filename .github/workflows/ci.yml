name: CI

on:
  push:
    branches:
      - main
      - product/project-intake-matching
      - audit/production-hardening
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stroyselect
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d stroyselect"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/stroyselect
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: ru-1
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration sequence
        run: npm run migrations:check

      - name: Apply database migrations
        run: npm run migrations:apply

      - name: Audit legacy runtime dependencies
        run: npm run legacy:audit

      - name: Security audit
        run: npm run security:audit

      - name: Authorization audit
        run: npm run authorization:audit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run seeded production E2E gate
        run: npm run test:e2e:production:seeded
