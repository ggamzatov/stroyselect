name: Refresh dependency lock

on:
  push:
    branches:
      - legal/russian-compliance-contracts
    paths:
      - .github/workflows/refresh-dependency-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: legal/russian-compliance-contracts

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile and patched framework
        run: |
          npm install --package-lock-only next@16.3.2 eslint-config-next@16.3.2
          npm audit fix --package-lock-only

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Commit refreshed manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency manifest changes"
            exit 0
          fi
          git commit -m "chore(deps): refresh patched dependency lock"
          git push origin HEAD:legal/russian-compliance-contracts
