name: Temporary dependency lock refresh

on:
  push:
    branches:
      - chatgpt/ci-redesign-alignment

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Skip bot refresh commit
        id: guard
        shell: bash
        run: |
          if [[ "${{ github.event.head_commit.message }}" == "chore: refresh dependency lock" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: chatgpt/ci-redesign-alignment

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependency tree
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: npm ci --include=dev

      - name: Refresh vulnerable dependency lock
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          npm audit fix --package-lock-only || true
          npm audit --omit=dev --audit-level=high || true

      - name: Commit refreshed lockfile
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore: refresh dependency lock"
          git push origin HEAD:chatgpt/ci-redesign-alignment
