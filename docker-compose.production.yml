services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stroyselect-app:${APP_IMAGE_TAG:-local}
    container_name: stroyselect-app
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
