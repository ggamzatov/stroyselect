services:
  postgres:
    image: postgres:17-alpine
    container_name: stroyselect-postgres
    restart: unless-stopped

    env_file:
      - .env.infrastructure

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - stroyselect_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stroyselect-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - stroyselect_redis_data:/data

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: stroyselect-minio
    restart: unless-stopped

    env_file:
      - .env.infrastructure

    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - stroyselect_minio_data:/data

    command:
      server /data
      --console-address ":9001"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: stroyselect-minio-init
    restart: "no"

    env_file:
      - .env.infrastructure

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set stroyselect http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing stroyselect/contractor-portfolio &&
      mc mb --ignore-existing stroyselect/project-files &&
      mc mb --ignore-existing stroyselect/chat-files
      "

volumes:
  stroyselect_postgres_data:
  stroyselect_redis_data:
  stroyselect_minio_data:
