services:
  postgres:
    image: postgres:17-alpine
    container_name: stroyselect-postgres
    restart: unless-stopped

    env_file:
      - .env.infrastructure

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - stroyselect_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stroyselect-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

    volumes:
      - stroyselect_redis_data:/data

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: stroyselect-minio
    restart: unless-stopped

    env_file:
      - .env.infrastructure

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - stroyselect_minio_data:/data

    command:
      server /data
      --console-address ":9001"

volumes:
  stroyselect_postgres_data:
  stroyselect_redis_data:
  stroyselect_minio_data:
